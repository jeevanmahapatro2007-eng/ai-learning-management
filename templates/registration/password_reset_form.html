{% extends 'base.html' %}
{% block title %}Reset password — Lodestar{% endblock %}
{% block content %}
<section class="ls-section">
  <div class="ls-container" style="max-width: 460px;">
    <span class="ls-eyebrow">Account recovery</span>
    <h1 class="ls-mt-16 ls-mb-24">Reset your password</h1>
    <div class="ls-panel">
      <p>Enter your email and we'll send a link to reset your password.</p>
      <form method="post" novalidate>
        {% csrf_token %}
        <div class="ls-field">
          <label for="id_email">Email</label>
          <input type="email" name="email" id="id_email" class="ls-input" required>
        </div>
        <button type="submit" class="ls-btn ls-btn-primary ls-btn-block">Send reset link</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
