{% extends 'base.html' %}
{% block title %}Contact — Lodestar{% endblock %}
{% block content %}
<section class="ls-section">
  <div class="ls-container" style="max-width: 620px;">
    <span class="ls-eyebrow">Contact</span>
    <h1 class="ls-mt-16 ls-mb-24">Get in touch</h1>
    <div class="ls-panel">
      <form method="post">
        {% csrf_token %}
        {% include 'partials/form_errors.html' %}
        <div class="ls-field">
          <label for="{{ form.name.id_for_label }}">Name</label>
          {{ form.name }}
        </div>
        <div class="ls-field">
          <label for="{{ form.email.id_for_label }}">Email</label>
          {{ form.email }}
        </div>
        <div class="ls-field">
          <label for="{{ form.subject.id_for_label }}">Subject</label>
          {{ form.subject }}
        </div>
        <div class="ls-field">
          <label for="{{ form.message.id_for_label }}">Message</label>
          {{ form.message }}
        </div>
        <button type="submit" class="ls-btn ls-btn-primary ls-btn-block">Send message</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
